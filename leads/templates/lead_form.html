{% extends "base.html" %}
{% block title %}{{ 'Edit Lead' if lead else 'New Lead' }}{% endblock %}
{% block content %}

<h2>{{ 'Edit Lead' if lead else 'New Lead' }}</h2>
<p class="subtitle">{{ lead.company if lead else 'Add a company to your pipeline' }}</p>

<form method="post" class="card">
  <div class="form-grid">
    <div class="form-group">
      <label>Company *</label>
      <input type="text" name="company" required value="{{ lead.company if lead else '' }}">
    </div>
    <div class="form-group">
      <label>Website</label>
      <input type="text" name="website" value="{{ lead.website if lead else '' }}">
    </div>
    <div class="form-group">
      <label>Industry</label>
      <select name="industry">
        <option value="">—</option>
        {% for key, name in industries %}
          <option value="{{ key }}" {% if lead and lead.industry == key %}selected{% endif %}>{{ name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>Country</label>
      <input type="text" name="country" value="{{ lead.country if lead else '' }}">
    </div>
    <div class="form-group">
      <label>City</label>
      <input type="text" name="city" value="{{ lead.city if lead else '' }}">
    </div>
    <div class="form-group">
      <label>Company Size</label>
      <input type="text" name="company_size" value="{{ lead.company_size if lead else '' }}">
    </div>
    <div class="form-group">
      <label>Contact Name</label>
      <input type="text" name="contact_name" value="{{ lead.contact_name if lead else '' }}">
    </div>
    <div class="form-group">
      <label>Contact Email</label>
      <input type="email" name="contact_email" value="{{ lead.contact_email if lead else '' }}">
    </div>
    <div class="form-group">
      <label>Contact Phone</label>
      <input type="text" name="contact_phone" value="{{ lead.contact_phone if lead else '' }}">
    </div>
    <div class="form-group">
      <label>Source</label>
      <input type="text" name="source" value="{{ lead.source if lead else '' }}" placeholder="referral / inbound / generator / linkedin">
    </div>
    <div class="form-group">
      <label>Grade</label>
      <select name="grade">
        <option value="">—</option>
        {% for g in ['A','B','C','D'] %}
          <option value="{{ g }}" {% if lead and lead.grade == g %}selected{% endif %}>{{ g }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>Opportunity Score (0-100)</label>
      <input type="number" name="opportunity_score" min="0" max="100" value="{{ lead.opportunity_score if lead else 0 }}">
    </div>
    <div class="form-group">
      <label>Status</label>
      <select name="status">
        {% for s in ['new','contacted','responded','converted','dead'] %}
          <option value="{{ s }}" {% if lead and lead.status == s %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
      </select>
    </div>
  </div>
  <div class="form-group" style="margin-top: 14px;">
    <label>Notes</label>
    <textarea name="notes" rows="4">{{ lead.notes if lead else '' }}</textarea>
  </div>
  <div class="actions-bar">
    <button type="submit" class="btn btn-primary">{{ 'Save Changes' if lead else 'Create Lead' }}</button>
    <a href="{{ url_for('crm') }}" class="btn btn-secondary">Cancel</a>
  </div>
</form>

{% endblock %}
